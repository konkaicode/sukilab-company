<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gummy Focus — Pomodoro & Stopwatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<style>
  /* Tab pill */
  .tab-btn {
    position: relative;
    border: none;
    cursor: pointer;
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 14px;
    color: var(--ink-soft);
    background: transparent;
    border-radius: 999px;
    padding: 10px 22px;
    display: inline-flex;
    align-items: center;
    letter-spacing: -0.005em;
    transition: color 0.15s ease, transform 0.15s ease;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn--active {
    color: #103848;
    background: linear-gradient(180deg, #d9f5e6 0%, #a9e3c9 55%, #8fd0e7 100%);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,0.95),
      inset 0 -3px 0 rgba(54,128,160,0.18),
      inset 0 0 0 1px rgba(255,255,255,0.5),
      0 6px 14px -4px rgba(80,180,180,0.45);
  }
  .tab-btn--active::after {
    content: "";
    position: absolute;
    left: 14%; right: 14%; top: 8%;
    height: 38%;
    background: linear-gradient(180deg, rgba(255,255,255,0.7), rgba(255,255,255,0));
    border-radius: 999px;
    pointer-events: none;
  }

  .icon-btn {
    width: 44px; height: 44px;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    color: var(--ink-soft);
    background: rgba(255,255,255,0.7);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,0.9),
      inset 0 -2px 0 rgba(31,39,72,0.05),
      0 4px 10px -4px rgba(31,39,72,0.15);
    display: grid; place-items: center;
    transition: transform 0.15s ease;
  }
  .icon-btn:hover { transform: translateY(-1px); color: var(--ink); }

  #root-loading {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    font-family: "Plus Jakarta Sans", sans-serif;
    color: #8a91ad;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div id="root"><div id="root-loading">読み込み中…</div></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="tree.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <script type="text/babel">
    const rootEl = document.getElementById("root");
    rootEl.innerHTML = "";
    ReactDOM.createRoot(rootEl).render(<App/>);
  </script>
</body>
</html>
